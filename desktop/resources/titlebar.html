<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" />
  <title>OmniAgent</title>
  <style>
    /* 壳自有导航条（对齐 WorkBuddy）：整条可拖拽，与侧栏同色 #2e2e2e；右上为原生三键
       （titleBarOverlay 系统绘制），右侧留白让位。左侧按钮组（收起侧边栏 / 新建任务）
       走 titlebar-preload 的 IPC 由主进程操控内容视图。后续扩展在此追加。 */
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center;
      background: #2e2e2e;
      -webkit-app-region: drag;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      user-select: none; overflow: hidden;
    }
    .nav-group {
      display: flex; align-items: center; gap: 2px;
      margin-left: 8px;
      -webkit-app-region: no-drag;
    }
    .nav-btn {
      width: 26px; height: 22px; padding: 0;
      display: flex; align-items: center; justify-content: center;
      background: transparent; border: none; border-radius: 4px;
      color: #cfcfcf; cursor: pointer;
    }
    .nav-btn:hover { background: rgba(255, 255, 255, 0.10); color: #fff; }
    .nav-btn:active { background: rgba(255, 255, 255, 0.16); }
    .nav-btn svg { width: 15px; height: 15px; }
    #status {
      margin-left: auto; margin-right: 150px; /* 让出原生三键区（约 138px） */
      font-size: 12px; color: #9e9e9e; white-space: nowrap;
    }
    #status.err { color: #f0a4ad; }
  </style>
</head>
<body>
  <div class="nav-group">
    <button class="nav-btn" id="btn-sidebar" title="收起/展开侧边栏">
      <!-- panel-left：矩形 + 左侧竖线 -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="16" rx="2" />
        <line x1="9" y1="4" x2="9" y2="20" />
      </svg>
    </button>
    <button class="nav-btn" id="btn-new" title="新建任务">
      <!-- message-square-plus：气泡 + 加号 -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
        <line x1="12" y1="7" x2="12" y2="13" />
        <line x1="9" y1="10" x2="15" y2="10" />
      </svg>
    </button>
  </div>
  <div id="status"></div>
  <script>
    window.setStatus = function (t, isErr) {
      var el = document.getElementById("status");
      el.textContent = t || "";
      el.className = isErr ? "err" : "";
    };
    if (window.omniNav) {
      document.getElementById("btn-sidebar").addEventListener("click", function () {
        window.omniNav.toggleSidebar();
      });
      document.getElementById("btn-new").addEventListener("click", function () {
        window.omniNav.newTask();
      });
    }
  </script>
</body>
</html>
