<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" />
  <title>OmniAgent</title>
  <style>
    /* 壳自有导航条（对齐 WorkBuddy）：与侧栏同色 #2e2e2e，右上为原生三键。
       ⚠ 拖拽区必须只落在 #bar（顶部 29px 条）内——本页 webContents 铺满整个窗口，
       内容视图（WebContentsView）只是覆盖在下方；Windows 下主窗口的 app-region
       命中测试会穿透覆盖层，若 body 整体设 drag，下方页面所有点击都会变成拖窗/
       最大化（元素点不到）。29 与 main.ts 的 TITLEBAR.height 保持一致。 */
    html, body {
      height: 100%; margin: 0;
      background: #2e2e2e;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      user-select: none; overflow: hidden;
    }
    #bar {
      position: fixed; top: 0; left: 0; right: 0; height: 29px;
      display: flex; align-items: center;
      -webkit-app-region: drag;
    }
    .nav-group {
      display: flex; align-items: center; gap: 2px;
      margin-left: 8px;
      -webkit-app-region: no-drag;
    }
    .nav-btn {
      width: 30px; height: 22px; padding: 0;
      display: flex; align-items: center; justify-content: center;
      background: transparent; border: none; border-radius: 4px;
      color: #b1b1b1; cursor: pointer;  /* 对齐参考配色 */
    }
    .nav-btn:hover { background: rgba(255, 255, 255, 0.14); color: #e0e0e0; }
    .nav-btn:active { background: rgba(255, 255, 255, 0.20); }
    .nav-btn svg { width: 16px; height: 16px; }
    /* 新建任务按钮：侧栏展开时侧栏自带「新建对话」入口（避免双入口），
       仅在侧栏收起后出现（main 进程同步 body.nav-collapsed） */
    #btn-new { display: none; }
    body.nav-collapsed #btn-new { display: flex; }
    #status {
      margin-left: auto; margin-right: 150px; /* 让出原生三键区（约 138px） */
      font-size: 12px; color: #b1b1b1; white-space: nowrap;
    }
    #status.err { color: #f0a4ad; }
  </style>
</head>
<body>
  <div id="bar">
    <div class="nav-group">
      <button class="nav-btn" id="btn-sidebar" title="收起/展开侧边栏">
        <!-- panel-left：矩形 + 左侧竖线 -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="2" />
          <line x1="9" y1="4" x2="9" y2="20" />
        </svg>
      </button>
      <button class="nav-btn" id="btn-new" title="新建任务">
        <!-- message-square-plus：气泡 + 加号 -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
          <line x1="12" y1="7" x2="12" y2="13" />
          <line x1="9" y1="10" x2="15" y2="10" />
        </svg>
      </button>
    </div>
    <div id="status"></div>
  </div>
  <script>
    window.setStatus = function (t, isErr) {
      var el = document.getElementById("status");
      el.textContent = t || "";
      el.className = isErr ? "err" : "";
    };
    // 侧栏收起态同步（main 进程在切换时调用）：控制「新建任务」按钮显隐
    window.setSidebarState = function (collapsed) {
      document.body.classList.toggle("nav-collapsed", !!collapsed);
    };
    if (window.omniNav) {
      document.getElementById("btn-sidebar").addEventListener("click", function () {
        window.omniNav.toggleSidebar();
      });
      document.getElementById("btn-new").addEventListener("click", function () {
        window.omniNav.newTask();
      });
    }
  </script>
</body>
</html>
