# ============================================================================
# QQ 通道（NapCat / OneBot 11）模板 → 拷到 ~/.omniagent/channels/napcat.yaml
#
# 每通道一个文件，网关启动时扫 channels/ 目录逐个拉起；文件名（napcat）就是
# 代码里的通道名，也是 msg_send_* 的 channel 参数、cron 的 notify_channel。
# routes.yaml 是唯一的例外：它是聊天路由表，不会被当通道拉起。
#
# 前置：装 NapCat（https://github.com/NapNeko/NapCatQQ），开启 HTTP（缺省 :3000）
#   与 WebSocket（缺省 :3001）服务，并把 ws_url 指向它——本程序是 WS **客户端**。
# 谁来读：通道网关（gateway/channel_gateway.py）。适配器在网关启动时按这份文件构造，
#   所以**改完要重启网关**（桌面端会自动拉起，不用手动跑）。Web 设置里没有通道页，纯手改。
# 能力闸门的安全前提：QQ 上任何人都能给这个号发消息，所以缺省**纯对话**
#   （allow_tools: false，模型侧连工具清单都没有）。除非确认只有你自己能发，
#   不要把 allow_tools 置 true——那等于把文件/键鼠/shell 交给全体陌生人。
# ============================================================================

enabled: false                  # 模板出厂关：NapCat 装好、token 填对之后再置 true
                                # （开着连不上只会看到重连日志刷屏，不影响其它功能）

# ── 连接 ────────────────────────────────────────────────────────────────────
http_url: http://127.0.0.1:3000 # 出站：OneBot 11 HTTP API（send_private_msg / send_group_msg）
ws_url: ws://127.0.0.1:3001     # 入站：正向 WS，本程序作为客户端连 NapCat；断线指数退避重连
token: ""                       # NapCat 侧配的 access token。留空则取 token_env 指向的环境变量
token_env: NAPCAT_TOKEN         # 推荐只写环境变量名，密钥不落盘
timeout_sec: 10                 # 单次 HTTP API 调用超时（秒）

# ── 触发闸门（三层，顺序固定：总闸 → 范围 → 形态）───────────────────────────
reply_groups: true              # 群消息总闸。false = 群消息**入口整体忽略**（@ 也不回）
reply_private: true             # 私聊总闸。false = 私聊整体忽略
require_at: true                # 群聊必须 @ 才响应（总闸开了才轮到它；false = 群消息全回，慎用）
allow_groups: []                # 响应范围白名单（群号字符串数组）；空 = 不限
                                # ⚠ 这是「哪些群允许她出现」，与 reply_groups 的「要不要理群」不同层
allow_users: []                 # 私聊白名单（QQ 号字符串数组）；空 = 谁私聊都回
default_chat_id: ""             # 广播兜底目标：private:<QQ> 或 group:<群号>。
                                # cron 的 notify_channel 指向 napcat 时就是发到这里；
                                # 留空 = 定时任务结果不外发（只留运行记录）

# ── 能力门 ──────────────────────────────────────────────────────────────────
allow_tools: false              # true 才允许本通道触发的 run 带工具（见上方安全前提）
images: true                    # 收到的图片作为**当轮**图片输入直传模型（只取首张）。
                                # 关 = 退回 [图片] 文本占位，省 token，也适用于模型无视觉
                                # 会话记录里始终只存文本投影，不写 base64
voice: true                     # **只控制入站**：语音转写成 [语音] <内容> 交给模型。
                                # 出站用不用语音由模型自己调 msg_send_voice / msg_send_text 决定，
                                # 通道不再按入站形式自动改发送形式（那是替模型做表达选择）。
                                # 运行时还要求 voice 插件就位，否则保留 [语音] 占位
voice_reply_ratio: 0.5          # 群里新话头用语音回复的比例（0 = 永远文字，1 = 永远语音）。
                                # 掷骰发生在话头开启时，之后热窗内粘住同一模式（中途变轨像机器人）；
                                # 只影响群，私聊恒文字。对方明确要求另一种形式时模型可改判

# ── 群自然存在感（doc/plans/implemented/group-presence-2026-10-30.md）────────
# 想让她「像个人一样在群里待着」而不是「只在被 @ 时营业」。
# 回不回是**通道侧算出来的**：一轮里她没调发送工具就什么都不会发；内心独白不外泄，
# 这类静默轮也不会再喂回下一轮上下文。
group_presence:
  enabled_groups: []            # 缺省全关：只有列在这里的群才有旁听/主动接话
                                # 例：["10001", "10002"]（群号字符串）
  aliases: []                   # 文本点名别名：没打 @、只喊名字也算被点名（T0）
                                # 登录昵称会自动并入，不用在这里重复写
  quiet_hours: "01-08"          # 安静时段（本地时间，支持跨零点如 "22-06"）：不主动，被点名仍回

  # 预算口径：**轮次**不是条数。主动开话 / 入场（波次升格）计一轮；
  # 同一轮内的接话续聊不计；被点名回复永远不计。
  talk_value: 0.3               # 话痨度 0~1 → 每小时主动开话目标 = 10·talk_value 个话头
                                # 0.3 ≈ 3 轮/小时。实测定过 0.5 偏聒噪，0.3 是回调后的值
  hourly_cap: 3                 # 每群每小时**新开**对话线程的硬闸（续聊不计）
  thread_hot_min: 5             # 她自己发过言之后的跟进期（分钟）：期内阈值下修、豁免退避、
                                # 语音模式粘滞、续聊不计费。调大 = 更爱追着聊，也更容易刷屏
  wave_floor: 0.45              # 预算花不完时的最低放行阈值（再冷清也不至于完全不出现）

  # 攒批与防抖：一条波次 = 一小段连续讨论，攒够静默才打分一次
  quiet_sec: 2.0                # 防抖静默窗（新消息会重置）
  same_author_extra: 0.5        # 同一人连发时的追加等待（秒），给「他说完了」留余地
  media_quiet_sec: 4.0          # 纯媒体消息（图片/表情）后的最低等待
  batch_cap_sec: 8.0            # 单批总时长上限（再热闹也要出结论）
  buffer_max_msgs: 12           # 缓冲条数上限
  buffer_max_sec: 600.0         # 缓冲时长上限（小时级挂着的群不会攒出巨型批次）

  # 节制器：连续被驳回（打分不够）后拉长检查间隔，省 CPU 也避免反复试探
  backoff_base: 5.0             # 空闲退避基数（×2ⁿ 秒）
  backoff_cap: 300.0            # 退避上限
  timers: true                  # 内置定时器；测试里会置 false 改由外部手动驱动评估

  # 打分权重：特征分 × 权重 → sigmoid → 与阈值比较。改这里=改她的「社交性格」，
  # 建议一次只动一个，并且留出观察期。每轮的判断依据（特征值、分数、放行与否）
  # 逐条落在 ~/.omniagent/presence/judgments.jsonl，调参先看这里而不是凭感觉。
  # 未列出的特征沿用代码里的 _WEIGHT_V0。
  weights:
    mention_name: 1.5           # 正文提到她的名字/别名（最强正向信号）
    at_other: -1.1              # @ 的是别人 → 别去抢话
    has_question: 0.5           # 疑问句
    placeholder_only: -1.0      # 纯媒体、没话可接
    recent_self_ratio: 2.0      # 最近 5 条里她自己发言的占比（对话在进行就延续）
    recent_count: -0.04         # 窗口内消息条数（刷屏越猛越闭嘴）
    log_silence: 0.05           # log1p(距上次发言秒数)：潜水越久越可能冒泡
    pending_count: 0.1          # 本波积压条数
    intercept: -1.2             # 基础截距

# ── 其余行为（写死在代码里、没有配置项，列出来是为了「别找了」）──────────────
# · 忽略 post_type=message_sent，否则本机发出的消息经 WS 回流变成新输入 → 自激循环
# · message_id 去重（LRU 2000 条）；长文本按 1200 字符分条发送
# · 群名靠 get_group_info 额外拉取并缓存 1 小时（OneBot 消息事件不带群名）
# · 群上下文默认带最近若干条（条数/单条/总量都有上限），窗口另见 gateway.im_history_minutes
# · 撞名避让：其他成员名片**严格包含**她的名字时会先遮掉再判 mention，
#   避免「群里另一只同名 agent 被人 @」被当成叫她
