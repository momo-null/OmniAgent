# ============================================================================
# 聊天路由表模板 → 拷到 ~/.omniagent/channels/routes.yaml
#
# 干什么用：把「某个 IM 会话」钉到「某个项目 + 某个会话」上。
#   project_id 决定三件事——工作目录、用哪份项目级 AGENTS.md（纪律文件）、
#   轨迹与记忆按哪个项目落盘；session_id 决定这条对话的历史接在哪条会话后面。
#
# 谁来读：两处，且只能是同一份规则——网关派发（channel_gateway）与**通道自身**
#   （napcat 要按会话所属项目去取最近的日记/场景块来拼场合自述）。两边各算一套
#   就会出现「记忆按 A 项目写、自述按 B 项目读」的错配，所以它单独成模块。
#   改完重启网关生效（每次解析都会重读文件，但通道只在构造时取归属）。
#
# ⚠ 这个文件不是通道：网关扫 channels/ 时会**排除** routes.yaml，不会为它建适配器。
# 命不中任何规则 = project 为空，由调用方退化成 default 或临时任务（不报错）。
# ============================================================================

# 匹配粒度两级，**精确优先**：先试 "<通道>:<chat_id>"，再退到 "<通道>:*"。
# chat_id 的格式跟通道自己的一致：napcat 是 group:<群号> / private:<QQ号>，
# feishu 是 oc_<chat_id>。

# ── 整条通道的默认归属（最常用：先给个兜底，再对个别群单独指定）──────────────
"napcat:*":
  project_id: "default"
  # session_id 不写 → 自动按 md5("napcat:group:10001") 派生为 s_napcat_xxxxxxxxxxxx，
  # 跨重启稳定。这是**默认**做法，正常情况下不要显式写 session_id。

# ── 单个会话精确指定 ────────────────────────────────────────────────────────
"napcat:group:10001":           # 构造值：某个项目工作群
  project_id: "demo-project"    # → 工作目录 projects/demo-project/，
                                #    并注入该项目的 AGENTS.md；轨迹落该项目下

"napcat:private:100000001":     # 构造值：某个人的私聊
  project_id: "personal"
  # session_id: "s_personal_fixed"
  # ↑ 只有「想和别处已有的会话接上同一条历史」才写，写错会导致历史分裂。
  #   正常情况全部留空，让程序按 chat 派生。

"feishu:oc_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx":
  project_id: "work-report"

# ── B站通道 ───────────────────────────────────────────────────────────────
# chat_id 两种形态：comment:<oid>:<type>:<root>:<parent>（每条评论线程一个会话，
# 历史按线程归档）与 "dynamic"（发动态）。整条通道统一钉到她的项目：
# 工作目录、运营纪律与轨迹落 projects/bilibili/。
"bilibili:*":
  project_id: "bilibili"

# ── 其余规则（代码里没有配置项，写在这里也不会被读取）───────────────────────
# · 优先级只看「精确键 vs 通道通配」，不做多条通配的层层覆盖
# · 通配只支持 "<通道>:*" 这一种形式，不支持 "napcat:group:*" 这类前缀通配
# · session_id 前缀特例：feishu 通道派生前缀是 s_feishu_，其它通道是 s_<通道名>_
