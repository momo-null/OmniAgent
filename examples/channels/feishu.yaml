# ============================================================================
# 飞书通道模板 → 拷到 ~/.omniagent/channels/feishu.yaml
#
# 与 napcat.yaml 同构：文件名（feishu）= 通道名 = msg_send_* 的 channel 参数
# = cron 的 notify_channel。谁来读：通道网关；改完重启网关生效。
#
# 与 QQ 的两点行为差异（不是配置项，是无法配掉的语义）：
#   · 回发模式 auto：模型直接回答就是回复；QQ 侧是 explicit（必须调 msg_send_*）。
#   · 接收走 lark-oapi 的 WebSocket 长连接，**免公网 IP**，不需要回调地址。
#
# 前置：飞书开放平台建「机器人」应用，拿到 app_id，开通 im 消息收发权限并把机器人
#   拉进目标会话；app_secret 用环境变量给，**不要写进这个文件**。
# ============================================================================

enabled: false                  # 模板默认关：填好 app_id + 环境变量后再置 true

# ── 凭证 ────────────────────────────────────────────────────────────────────
app_id: ""                      # 飞书应用的 App ID（cli_xxx 那种），这个可以明文写
app_secret_env: FEISHU_APP_SECRET
                                # ↑ 只填**环境变量名**；代码按它去 os.environ 取密钥。
                                #   想换变量名就改这里（缺省即 FEISHU_APP_SECRET）。
                                #   注意：没有 app_secret 这个键——明文写进来不会被读取。

# ── 会话范围与投递目标 ──────────────────────────────────────────────────────
default_chat_id: ""             # oc_ 开头的 chat_id。两个用途：
                                #   1) cron 的 notify_channel 指到 feishu 时广播到这里；
                                #   2) allow_chat_ids 为空时的**隐式白名单**（见下行）。
allow_chat_ids: []              # 响应哪些会话（chat_id 数组）。留空 = 自动取
                                #   {default_chat_id} 单元素集合——即「只在你指定的那个会话里说话」。
                                #   显式列多个会话时才需要写。
allow_user_ids: []              # 响应哪些人（open_id / user_id 数组）。空 = 不限人，只看会话。
                                #   想「全组织可见但只有我能使唤它」= 这里收紧到单账号，
                                #   并考虑把 allow_tools 保持 false。

# ── 能力门 ──────────────────────────────────────────────────────────────────
allow_tools: false              # 机器人可达范围 = 组织内任何人（甚至外部联系人）→ 缺省纯对话。
                                #   只有确认 allow_user_ids 已收紧到自己，才可置 true。
                                #   置 true = 给机器人发消息的人可驱动文件 / shell / 设备工具。

# ── 其余行为（写死在代码里，没有配置项）─────────────────────────────────────
# · 出站文本按 4000 字符截断；send_card 走新版卡片 schema（content 直接用卡片 JSON，
#   外面不能再包 {"card": ...}，否则 230099 parse error）
# · 入站消息 id 去重表持久化在 ~/.omniagent/feishu_seen_message_ids.json（上限 2000 条），
#   所以**重启不会重复处理**历史消息；删掉这个文件等于重置去重
# · 没配 default_chat_id 时 broadcast 直接返回错误（不抛异常，不影响任务本身）

# ── 出站守则 ──────────────────────────────────────────────────────────────
outbound:
  identity: ""
  style: ""
  max_chars: 0
  max_sentences: 0
  allow_multi: true
  require_review: false
  # feishu 的 chat_id 无场合前缀，by_context 一般用不上；要按会话区分请精确配 routes
